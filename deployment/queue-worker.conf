[program:transcript-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/trans_new/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/trans_new/storage/logs/queue-worker.log
stopwaitsecs=3600
